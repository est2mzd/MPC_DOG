/**/local_planner:
  ros__parameters:
    local_planner: 
      update_rate: 333.0                  # Local planning loop rate, Hz
      timestep: 0.03                      # Horizon discretization timestep, s
      horizon_length: 40                  # [MPC_DOG] was 26; must exceed period_=period/dt (0.9/0.03=30) so the horizon covers a full slow-crawl gait cycle
      cmd_vel_filter_const: 0.10          # Low-pass filter constant for twist commands
      cmd_vel_scale: 1.0                  # Scale factor applied to twist commands
      last_cmd_vel_msg_time_max: 2.0      # Max age before cmd_vel is ignored, s
      stand_vel_threshold: 0.1            # Body speed below which stand mode is allowed, m/s
      stand_cmd_vel_threshold: 0.05       # Command speed below which stand mode is allowed, m/s
                                           # (元は0.1。0.1 m/s指令時にcmd_vel_.norm() >
                                           # stand_cmd_vel_threshold_の厳密な">"比較を満たせず
                                           # 歩行に移行しない事象を確認したため、0.1 m/sの指令が
                                           # 確実にこの閾値を超えるよう0.05へ変更。ユーザー指示
                                           # により実施、2026-08-30)
      stand_pos_error_threshold: 0.05     # Position error tolerated while standing, m
      stop_on_invalid_foothold: true      # [MPC_DOG Phase 2A] gate invalid footholds before NMPC; false = pre-Phase-2A behaviour
      safe_stop_latch: true               # [MPC_DOG Phase 2B] on an invalid foothold within safe_stop_horizon, latch a graceful stop (cmd_vel:=0 -> STEP->STAND -> hold, plan keeps publishing) instead of freezing the plan; false = Phase 2A withhold-the-plan behaviour
      safe_stop_horizon: 40               # [MPC_DOG Phase 2B] horizon-step window; only invalid footholds this close latch the stop (default = whole horizon)
      safe_stop_lookahead: 2.5            # [MPC_DOG Phase 2B-3] m to probe the terrain map forward from the body (independent of the NMPC horizon) for an uncrossable gap; latch the stop before entering a field of crossable gaps that ends at a cliff. 0 disables. No-op when edge_clearance == 0.
    local_footstep_planner:
      grf_weight: 0.45                   # Blend weight between GRF and terrain foothold costs
      standing_error_threshold: 0.03     # Foot position error tolerated while standing, m
      foothold_obj_threshold: 0.6        # Minimum terrain score for candidate footholds
      obj_fun_layer: traversability      # Grid map layer used for foothold scoring
      edge_clearance: 0.0                # [MPC_DOG Phase 3] m. 0 = off (foothold may sit on a hole lip, pre-Phase-3). >0 = a foothold with a hole/off-map cell within this radius is EDGE_TOO_CLOSE (-> Phase 2A withholds the plan). Kept 0 so step03/04 gap-crossing is unchanged; opt in per run.
      max_crossable_gap: 0.6             # [MPC_DOG Phase 3] m. An EDGE_TOO_CLOSE foothold whose hole has solid ground again within this reach ahead is put back to VALID (crossable gap, e.g. the 0.3 m step03/04 trench). Only holes with no far side within reach (cliffs / wide trenches) keep EDGE_TOO_CLOSE.

# Session 2 (sampling track): flat tuning baseline for MPPI
session_id: session02_flat_tune_sampling
description: |
  Parallel to session02_flat_tune. Tune sigma_mppi / step_freq on flat.

patches:
  robot: go2
  mpc_params.type: sampling
  mpc_params.sampling_method: mppi
  mpc_params.device: cpu
  mpc_params.num_parallel_computations: 800
  mpc_params.num_sampling_iterations: 1
  mpc_params.sigma_mppi: 3
  mpc_params.mu: 0.5
  mpc_params.use_foothold_optimization: false
  simulation_params.reflex_trigger_mode: false
  simulation_params.scene: flat
  simulation_params.gait: trot
  simulation_params.mode: human
  simulation_params.mpc_frequency: 50
  simulation_params.swing_position_gain_fb: 500
  simulation_params.swing_velocity_gain_fb: 10
  simulation_params.impedence_joint_position_gain: 10.0
  simulation_params.impedence_joint_velocity_gain: 2.0

gait_patches:
  trot:
    step_freq: 1.4
    duty_factor: 0.65

tuning_hints:
  - param: mpc_params.sigma_mppi
    try: [2, 3, 5]
  - param: gait_patches.trot.step_freq
    try: [1.2, 1.4, 1.6]

notes: |
  Notebook 13: compare sigma_mppi and nominal vs sampling side-by-side.

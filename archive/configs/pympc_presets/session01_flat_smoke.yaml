# Session 1: 平坦スモーク — GRF 可視化・最小構成
session_id: session01_flat_smoke
description: |
  初回 codegen 含む。足場 opt OFF、flat 地形、trot。
  ゴール: 30s 以上 trot + GRF 矢印表示。

patches:
  robot: go2
  mpc_params.type: nominal
  mpc_params.verbose: false
  mpc_params.horizon: 12
  mpc_params.dt: 0.02
  mpc_params.mu: 0.5
  mpc_params.use_foothold_optimization: false
  mpc_params.solver_mode: balance
  simulation_params.scene: flat
  simulation_params.gait: trot
  simulation_params.mode: human
  simulation_params.mpc_frequency: 100
  simulation_params.ref_z: null  # null = hip_height のまま

gait_patches:
  trot:
    step_freq: 1.4
    duty_factor: 0.65

notes: |
  起動後5秒待ってから ↑ キー。GRF 緑矢印を確認。

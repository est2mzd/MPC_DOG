# Session 3b (Lyapunov track): perlin rough terrain
session_id: session03_rough_perlin_lyapunov
description: |
  Parallel to session03_rough_perlin. Conservative gait for Lyapunov on perlin.

patches:
  robot: go2
  mpc_params.type: lyapunov
  mpc_params.mu: 0.46
  mpc_params.use_foothold_optimization: true
  mpc_params.solver_mode: balance
  simulation_params.scene: perlin
  simulation_params.gait: trot
  simulation_params.mode: human
  mpc_params.horizon: 12
  mpc_params.dt: 0.02
  simulation_params.mpc_frequency: 100
  simulation_params.visual_foothold_adaptation: blind

optional_patches:
  - mpc_params.use_foothold_constraints

gait_patches:
  trot:
    step_freq: 1.1
    duty_factor: 0.74

notes: |
  Notebook 18: perlin with Lyapunov constraints.

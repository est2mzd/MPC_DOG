# Session 1 リトライ: やや高い CoM 参照
session_id: session01_flat_smoke_retry
description: Session1 即転倒時。ref_z を hip_height * 1.05 相当に上げる試行。

patches:
  robot: go2
  mpc_params.type: nominal
  mpc_params.use_foothold_optimization: false
  mpc_params.mu: 0.5
  mpc_params.solver_mode: balance
  simulation_params.scene: flat
  simulation_params.gait: trot
  simulation_params.mode: human
  simulation_params.mpc_frequency: 100

gait_patches:
  trot:
    step_freq: 1.2
    duty_factor: 0.7

# ref_z multiplier applied in apply script when ref_z_scale is set
ref_z_scale: 1.05

notes: |
  step_freq を下げ duty を上げて安定優先。

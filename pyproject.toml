[project]
name = "mpc-dog"
version = "0.1.0"
description = "Quadruped MPC demo sandbox — OSS reference + YAML experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "pillow>=10.0",
  "casadi>=3.6",
  "gymnasium>=0.29",
  "mujoco>=3.0",
  "gym-quadruped>=1.1.5",
  "liecasadi>=0.0.2",
  "readchar>=4.0",
  "pin>=2.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
workshop = [
  "jupyter>=1.0",
  "jupyterlab>=4.0",
  "nbconvert>=7.0",
  "ipykernel>=6.29",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# dev deps via: uv sync --extra dev

[dependency-groups]
dev = ["pytest>=7.0"]

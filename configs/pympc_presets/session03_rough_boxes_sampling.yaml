# Session 3a (sampling track): random_boxes — no gradient foothold opt
session_id: session03_rough_boxes_sampling
description: |
  Parallel to session03_rough_boxes. Sampling MPC on box terrain (foothold opt N/A).

patches:
  robot: go2
  mpc_params.type: sampling
  mpc_params.sampling_method: mppi
  mpc_params.device: cpu
  mpc_params.num_parallel_computations: 800
  mpc_params.num_sampling_iterations: 1
  mpc_params.sigma_mppi: 3
  mpc_params.mu: 0.48
  mpc_params.use_foothold_optimization: false
  simulation_params.reflex_trigger_mode: false
  simulation_params.scene: random_boxes
  simulation_params.gait: trot
  simulation_params.mode: human
  simulation_params.mpc_frequency: 50
  simulation_params.visual_foothold_adaptation: blind

gait_patches:
  trot:
    step_freq: 1.2
    duty_factor: 0.72

notes: |
  Gradient track uses foothold opt; sampling relies on rollout robustness + blind adaptation.

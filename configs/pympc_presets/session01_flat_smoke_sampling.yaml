# Session 1 (sampling track): IROS 2024 GPU sample-based MPC — flat smoke
session_id: session01_flat_smoke_sampling
description: |
  Parallel to session01_flat_smoke. JAX MPPI on flat trot (CPU-friendly rollout count).
  Paper: Turrisi et al. IROS 2024 — sample-based stochastic predictive control.

patches:
  robot: go2
  mpc_params.type: sampling
  mpc_params.sampling_method: mppi
  mpc_params.device: cpu
  mpc_params.num_parallel_computations: 800
  mpc_params.num_sampling_iterations: 1
  mpc_params.sigma_mppi: 3
  mpc_params.mu: 0.5
  mpc_params.use_foothold_optimization: false
  simulation_params.reflex_trigger_mode: false
  simulation_params.scene: flat
  simulation_params.gait: trot
  simulation_params.mode: human
  simulation_params.mpc_frequency: 50

gait_patches:
  trot:
    step_freq: 1.4
    duty_factor: 0.65

notes: |
  First run: JAX JIT compile (~1–3 min). use_foothold_optimization has no effect for sampling.
  Compare with session01_flat_smoke (nominal acados) in notebook 12.

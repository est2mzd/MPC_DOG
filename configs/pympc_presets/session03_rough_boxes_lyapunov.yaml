# Session 3a (Lyapunov track): random_boxes + foothold opt
session_id: session03_rough_boxes_lyapunov
description: |
  Parallel to session03_rough_boxes. Lyapunov NMPC supports gradient foothold optimization.

patches:
  robot: go2
  mpc_params.type: lyapunov
  mpc_params.mu: 0.48
  mpc_params.use_foothold_optimization: true
  mpc_params.solver_mode: balance
  simulation_params.scene: random_boxes
  simulation_params.gait: trot
  simulation_params.mode: human
  simulation_params.mpc_frequency: 100
  simulation_params.visual_foothold_adaptation: blind

optional_patches:
  - mpc_params.use_foothold_constraints

gait_patches:
  trot:
    step_freq: 1.2
    duty_factor: 0.72

notes: |
  Notebook 18: boxes terrain with Lyapunov stability + foothold opt.
